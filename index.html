<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>recall - flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="context-menu" id="contextMenu" hidden></div>

    <main>
        <section class="screen actions-only" id="homeScreen" aria-label="Home">
            <section class="deck-organizer" aria-label="deck organizer">
                <h2>decks</h2>
                <form id="deckForm" class="deck-form">
                    <input id="deckNameInput" type="text" required placeholder="new deck name">
                    <button class="basic-button" type="submit">create deck</button>
                </form>
                <div id="deckList"></div>
            </section>
            <section class="quick-panel" aria-label="flashcard actions">
                <button class="quick-action primary" id="createCardButton" type="button"><span class="action-icon">+</span><span><strong>create</strong><small>ʕ•ᴥ•ʔ</small></span><b>→</b></button>
                <button class="quick-action" id="randomStudyButton" type="button"><span class="action-icon play">▶</span><span><strong>practice</strong><small>ʕ•́ᴥ•̀ʔ</small></span><b>→</b></button>
            </section>
        </section>

        <section class="screen maker-screen" id="makerScreen" hidden>
            <div class="page-content">
                <div class="section-title">
                    <button class="mini-back" id="backFromMaker" type="button">&lt;</button>
                    <h1>create</h1>
                </div>
                <div class="maker-content">
                    <form id="cardForm">
                        <label for="questionInput">question</label>
                        <textarea id="questionInput" required placeholder="ヽ(~_~(・_・ )ゝ"></textarea>
                        <label for="answerInput">answer</label>
                        <textarea id="answerInput" required placeholder="ヽ(￣ω￣(。。 )ゝ"></textarea>
                        <button class="basic-button" id="cardSubmitButton" type="submit">add flashcard</button>
                    </form>
                    <section class="cards-section">
                        <h2>current cards</h2>
                        <ol id="cardList"><li class="empty-message">no cards :(</li></ol>
                    </section>
                </div>
            </div>
        </section>

        <section class="screen study-screen" id="studyScreen" hidden>
            <div class="page-content">
                <div class="section-title">
                    <button class="mini-back" id="backFromStudy" type="button">&lt;</button>
                    <h1>practice</h1>
                </div>
                <div class="practice-content">
                    <h2 id="studyQuestion"></h2>
                    <div class="practice-options-area">
                        <div class="answer-options" id="answerOptions"></div>
                        <p id="studyFeedback" aria-live="polite"></p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
